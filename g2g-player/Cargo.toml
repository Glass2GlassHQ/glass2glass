[package]
name = "g2g-player"
description = "Embeddable media player on glass2glass: load a URI or launch line, control playback, render video into the host's OpenGL framebuffer or wgpu texture."
license.workspace = true
readme = "README.md"
keywords = ["multimedia", "video", "player", "opengl", "playback"]
categories = ["multimedia", "multimedia::video"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
wgpu = ["g2g-plugins/wgpu-sink", "dep:wgpu"]
openh264 = ["g2g-plugins/openh264"]

[dependencies]
g2g-core = { workspace = true, features = ["std", "runtime", "multi-thread"] }
g2g-plugins = { workspace = true, features = ["std", "multi-thread", "gl-render", "hqdn3d"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
wgpu = { version = "30", optional = true }

[dev-dependencies]
pollster = "0.4"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
