name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_RELEASE_STRIP: symbols
  # a fresh Windows install has no Visual C++ runtime
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
  # libopus builds with cmake and must use the same static C runtime
  CMAKE_TOOLCHAIN_FILE_x86_64_pc_windows_msvc: ${{ github.workspace }}/tools/msvc-static-crt.cmake

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    # manylinux_2_28 has glibc 2.28, so the binaries run on RHEL 8 and newer
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, container: "quay.io/pypa/manylinux_2_28_x86_64", target: x86_64-unknown-linux-gnu, features: release-binary-linux, package_arch: amd64, nfpm_asset: nfpm_2.48.0_Linux_x86_64.tar.gz, nfpm_sha256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750 }
          - { runner: ubuntu-24.04-arm, container: "quay.io/pypa/manylinux_2_28_aarch64", target: aarch64-unknown-linux-gnu, features: release-binary-linux, package_arch: arm64, nfpm_asset: nfpm_2.48.0_Linux_arm64.tar.gz, nfpm_sha256: a9a75213763783b7669719e505474c748c5ad7dc66591a195619deb50f85c2f4 }
          - { runner: macos-latest, target: aarch64-apple-darwin, features: release-binary-macos }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, features: release-binary-macos }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, features: release-binary-windows }
    env:
      # the ffmpeg libraries ship in lib/ next to the binary, DT_RPATH also covers libavcodec loading libavutil
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-Wl,--disable-new-dtags,-rpath,$ORIGIN/lib
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-Wl,--disable-new-dtags,-rpath,$ORIGIN/lib
      # the same on macOS, where dyld expands @executable_path
      CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS: -C link-arg=-Wl,-rpath,@executable_path/lib
      CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS: -C link-arg=-Wl,-rpath,@executable_path/lib
    defaults:
      run:
        shell: bash
    steps:
      - name: install build packages
        if: runner.os == 'Linux'
        run: dnf install -y clang-devel cmake nasm xz git wayland-devel libxkbcommon-devel
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: codec prefix
        run: echo "CODEC_PREFIX=$HOME/g2g-codecs" >> "$GITHUB_ENV"
      # delocate and the linker warn on libraries newer than the deployment target, and clang targets the runner's macOS unless told otherwise
      - name: macOS build setup
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> "$GITHUB_ENV"
      # cargo-about has no prebuilt intel mac binary, and a source install needs its cli feature
      # ffmpeg, libvpx and rav1d assemble their x86 code with nasm
      - name: intel mac build setup
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          brew install nasm
          cargo install cargo-about --version 0.9.3 --locked --features cli
      - name: build ffmpeg
        if: runner.os != 'Windows'
        run: tools/ffmpeg-build.sh "$CODEC_PREFIX" | sed 's/^export //' >> "$GITHUB_ENV"
      # Windows builds the same ffmpeg with MSVC under MSYS2; the DLLs ship beside g2g-launch.exe
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      # with the developer environment set rustc takes link.exe from PATH, where a bash step
      # finds Git's coreutils `link` first, so name the MSVC linker outright
      - name: pin the MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$env:VCToolsInstallDir\bin\Hostx64\x64\link.exe" >> $env:GITHUB_ENV
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MSYS
          path-type: inherit
          update: false
          install: make nasm diffutils
      - name: build ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          tools/ffmpeg-build.sh /c/g2g-ffmpeg | sed 's/^export //' >> "$GITHUB_ENV"
          echo "FFMPEG_PREFIX=/c/g2g-ffmpeg" >> "$GITHUB_ENV"
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
      - name: build libvpx
        run: tools/libvpx-build.sh "$CODEC_PREFIX" | sed 's/^export //' >> "$GITHUB_ENV"
      - name: build
        run: >
          cargo build --locked --release -p g2g-plugins --target ${{ matrix.target }}
          --features ${{ matrix.features }} --bin g2g-launch --bin g2g-inspect
      # glibc before 2.34 ships libdl, libpthread and librt as separate libraries, and newer glibc keeps stubs under the same names
      - name: links only system and bundled libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          unexpected=$(readelf -d target/${{ matrix.target }}/release/g2g-launch "$CODEC_PREFIX"/lib/lib*.so.*.*.* \
            | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' | sort -u \
            | grep -vxE 'libc\.so\.6|libm\.so\.6|libdl\.so\.2|libpthread\.so\.0|librt\.so\.1|libgcc_s\.so\.1|libstdc\+\+\.so\.6|ld-linux-.*\.so\.[0-9]+' \
            | while read -r library; do [ -f "$CODEC_PREFIX/lib/$library" ] || echo "$library"; done)
          [ -z "$unexpected" ] || { echo "::error::g2g-launch links $unexpected"; exit 1; }
      - name: links only system and bundled libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          unexpected=$(for binary in target/${{ matrix.target }}/release/g2g-launch "$CODEC_PREFIX"/lib/libav*.dylib "$CODEC_PREFIX"/lib/libswscale*.dylib; do
              otool -L "$binary" | tail -n +2 | awk '{print $1}'
            done | sort -u | grep -vE '^(/usr/lib/|/System/Library/)' \
            | while read -r library; do [ -e "$CODEC_PREFIX/lib/${library#@rpath/}" ] || echo "$library"; done)
          [ -z "$unexpected" ] || { echo "::error::g2g-launch links $unexpected"; exit 1; }
      # windows runners carry the Visual C++ runtime in System32, a fresh install does not
      - name: links only system and bundled libraries (Windows)
        if: runner.os == 'Windows'
        run: |
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          system32="$(cygpath -u "$SYSTEMROOT")/System32"
          bundled="$FFMPEG_PREFIX/bin"
          dumpbin=$("$vswhere" -latest -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | head -n 1 | tr -d '\r')
          # the ffmpeg DLLs ship too, so their own imports must be system or bundled as well
          unexpected=$(for binary in target/${{ matrix.target }}/release/g2g-launch.exe \
              target/${{ matrix.target }}/release/g2g-inspect.exe "$bundled"/*.dll; do
              "$dumpbin" -nologo -dependents "$binary"
            done | tr -d '\r' | grep -iE '^\s+\S+\.dll$' | tr -d ' ' | sort -u \
            | grep -viE '^(api|ext)-ms-' \
            | while read -r library; do
                if echo "$library" | grep -qiE '^(vcruntime|msvcp|concrt|vcomp)'; then echo "$library"
                elif [ -f "$bundled/$library" ]; then :
                elif [ ! -f "$system32/$library" ]; then echo "$library"; fi
              done)
          [ -z "$unexpected" ] || { echo "::error::release binaries link $unexpected"; exit 1; }
      - uses: taiki-e/install-action@v2
        if: matrix.target != 'x86_64-apple-darwin'
        with:
          tool: cargo-about@0.9.3
      - name: third-party licences
        run: >
          cargo about generate --locked --fail -m g2g-plugins/Cargo.toml --features ${{ matrix.features }}
          about.hbs -o LICENSE-THIRD-PARTY.txt
      - name: package
        run: |
          name="g2g-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/g2g-launch* target/${{ matrix.target }}/release/g2g-inspect* LICENSE LICENSE-THIRD-PARTY.txt "$name/"
          rm -f "$name"/*.d "$name"/*.pdb
          if [ "${{ runner.os }}" = Linux ]; then
            mkdir "$name/lib"
            find "$CODEC_PREFIX/lib" -maxdepth 1 -name 'lib*.so.*' ! -name '*.so.*.*' -exec cp -L {} "$name/lib/" \;
            cp "$CODEC_PREFIX"/ffmpeg-*/COPYING.LGPLv2.1 "$name/LICENSE-FFMPEG.txt"
          fi
          if [ "${{ runner.os }}" = macOS ]; then
            mkdir "$name/lib"
            find "$CODEC_PREFIX/lib" -maxdepth 1 -type l -name 'lib*.*.dylib' -exec cp -L {} "$name/lib/" \;
            cp "$CODEC_PREFIX"/ffmpeg-*/COPYING.LGPLv2.1 "$name/LICENSE-FFMPEG.txt"
          fi
          if [ "${{ runner.os }}" = Windows ]; then
            # the DLL search starts in the executable's directory
            cp "$FFMPEG_PREFIX"/bin/*.dll "$name/"
            cp "$FFMPEG_PREFIX"/ffmpeg-*/COPYING.LGPLv2.1 "$name/LICENSE-FFMPEG.txt"
          fi
          "$name/g2g-launch" -q audiotestsrc num-buffers=5 ! fakesink
          "$name/g2g-launch" -q audiotestsrc num-buffers=20 ! avenc_aac ! fakesink
          "$name/g2g-launch" -q videotestsrc num-buffers=10 ! vpxenc codec=vp8 ! fakesink
          # decodebin must pick a decoder that runs on a host with no GPU
          for encoder in "av1enc ! mp4mux" "vpxenc codec=vp9 ! webmmux"; do
            "$name/g2g-launch" -q videotestsrc num-buffers=5 ! video/x-raw,format=I420,width=320,height=240,framerate=30/1 ! $encoder ! filesink location=smoke.bin
            "$name/g2g-launch" -q filesrc location=smoke.bin ! decodebin ! fakesink
          done
          rm smoke.bin
          cp "$CODEC_PREFIX/LICENSE-LIBVPX.txt" "$name/"
          if [ "${{ runner.os }}" = Windows ]; then 7z a "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
          # LGPL: the ffmpeg source the bundled libraries were built from
          if [ "${{ matrix.target }}" = x86_64-unknown-linux-gnu ]; then cp "$CODEC_PREFIX"/ffmpeg-*.tar.xz .; fi
      - name: deb and rpm
        if: runner.os == 'Linux'
        env:
          PACKAGE_ARCH: ${{ matrix.package_arch }}
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v2.48.0/${{ matrix.nfpm_asset }}" -o nfpm.tar.gz
          echo "${{ matrix.nfpm_sha256 }}  nfpm.tar.gz" | sha256sum -c -
          tar xzf nfpm.tar.gz -C /usr/local/bin nfpm
          rm nfpm.tar.gz
          export PACKAGE_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          export PACKAGE_TREE="$PWD/g2g-${GITHUB_REF_NAME}-${{ matrix.target }}"
          nfpm package -f tools/nfpm.yaml -p deb
          nfpm package -f tools/nfpm.yaml -p rpm
      - name: msi
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet tool install --tool-path "$env:RUNNER_TEMP\wix" wix --version 7.0.1
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$' | Select-Object -First 1).Matches.Groups[1].Value
          $tree = "$PWD\g2g-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          & "$env:RUNNER_TEMP\wix\wix.exe" build tools\glass2glass.wxs -arch x64 -acceptEula wix7 -d "PackageVersion=$version" -d "PackageTree=$tree" -o "glass2glass-$version-x64.msi"
      - uses: actions/upload-artifact@v7
        with:
          name: release-asset-${{ matrix.target }}
          path: |
            g2g-*.tar.gz
            g2g-*.zip
            ffmpeg-*.tar.xz
            *.deb
            *.rpm
            *.msi

  linux-package-install:
    name: install (${{ matrix.image }}, ${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, image: "almalinux:8", target: x86_64-unknown-linux-gnu, install: "dnf install -y dist/*.rpm" }
          - { runner: ubuntu-24.04, image: "rockylinux:9", target: x86_64-unknown-linux-gnu, install: "dnf install -y dist/*.rpm" }
          - { runner: ubuntu-24.04, image: "fedora:43", target: x86_64-unknown-linux-gnu, install: "dnf install -y dist/*.rpm" }
          - { runner: ubuntu-24.04, image: "ubuntu:22.04", target: x86_64-unknown-linux-gnu, install: "apt-get update && apt-get install -y ./dist/*.deb" }
          - { runner: ubuntu-24.04, image: "debian:13", target: x86_64-unknown-linux-gnu, install: "apt-get update && apt-get install -y ./dist/*.deb" }
          - { runner: ubuntu-24.04-arm, image: "almalinux:8", target: aarch64-unknown-linux-gnu, install: "dnf install -y dist/*.rpm" }
          - { runner: ubuntu-24.04-arm, image: "debian:13", target: aarch64-unknown-linux-gnu, install: "apt-get update && apt-get install -y ./dist/*.deb" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-asset-${{ matrix.target }}
          path: dist
      - name: install
        run: ${{ matrix.install }}
      - name: smoke run
        run: |
          g2g-inspect fakesink
          g2g-launch -q audiotestsrc num-buffers=5 ! fakesink
          g2g-launch -q audiotestsrc num-buffers=20 ! avenc_aac ! fakesink
          g2g-launch -q videotestsrc num-buffers=10 ! vpxenc codec=vp8 ! fakesink

  msi-install:
    name: install msi
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-asset-x86_64-pc-windows-msvc
          path: dist
      - name: install, run and uninstall
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $msi = (Get-ChildItem dist\*.msi).FullName
          $installed = "$env:ProgramFiles\glass2glass"
          $install = Start-Process msiexec -Wait -PassThru -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'install.log'
          if ($install.ExitCode -ne 0) { Get-Content install.log -Tail 40; exit $install.ExitCode }
          # windows gives the new PATH only to processes started after the install
          $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine')
          if ((Get-Command g2g-launch).Source -notlike "$installed\*") { throw "g2g-launch is not on the machine PATH" }
          g2g-inspect fakesink
          g2g-launch -q audiotestsrc num-buffers=5 ! fakesink
          g2g-launch -q audiotestsrc num-buffers=20 ! avenc_aac ! fakesink
          g2g-launch -q videotestsrc num-buffers=10 ! vpxenc codec=vp8 ! fakesink
          $uninstall = Start-Process msiexec -Wait -PassThru -ArgumentList '/x', "`"$msi`"", '/qn', '/l*v', 'uninstall.log'
          if ($uninstall.ExitCode -ne 0) { Get-Content uninstall.log -Tail 40; exit $uninstall.ExitCode }
          if (Test-Path "$installed\g2g-launch.exe") { throw "uninstall left g2g-launch.exe" }
          if ([Environment]::GetEnvironmentVariable('PATH', 'Machine') -like "*$installed*") { throw "uninstall left the PATH entry" }

  homebrew-install:
    name: brew install (${{ matrix.runner }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: release-asset-*-apple-darwin
          path: dist
          merge-multiple: true
      - name: install and test from a local tap
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          brew tap-new --no-git g2g/local
          tools/homebrew-formula.sh "$version" "$GITHUB_REF_NAME" "file://$PWD/dist" dist > "$(brew --repository g2g/local)/Formula/glass2glass.rb"
          brew install g2g/local/glass2glass
          brew test g2g/local/glass2glass

  aar:
    name: android aar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: install cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - name: build
        run: |
          aar=$(ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" tools/android-aar.sh | tail -1)
          mkdir dist
          cp "$aar" "dist/g2g-${GITHUB_REF_NAME}-android.aar"
          cargo about generate --locked --fail -m g2g-uniffi/Cargo.toml --features release-aar about.hbs -o LICENSE-THIRD-PARTY.txt
          zip "dist/g2g-${GITHUB_REF_NAME}-android.aar" LICENSE LICENSE-THIRD-PARTY.txt
          tools/maven-central.sh layout "dist/g2g-${GITHUB_REF_NAME}-android.aar" "$(dirname "$aar")/generated" maven-layout
      - uses: actions/upload-artifact@v7
        with:
          name: release-asset-android
          path: dist/*.aar
      - uses: actions/upload-artifact@v7
        with:
          name: maven-layout
          path: maven-layout

  wheel:
    name: wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, features: release-wheel-linux }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, features: release-wheel-linux }
          - { runner: macos-latest, target: aarch64-apple-darwin, features: release-wheel-macos }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, features: release-wheel-macos }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, features: release-wheel-windows }
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        if: matrix.target != 'x86_64-apple-darwin'
        with:
          tool: cargo-about@0.9.3
      # delocate and the linker warn on libraries newer than the deployment target, and clang targets the runner's macOS unless told otherwise
      - name: macOS build setup
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> "$GITHUB_ENV"
      # cargo-about has no prebuilt intel mac binary, and a source install needs its cli feature
      # ffmpeg, libvpx and rav1d assemble their x86 code with nasm
      - name: intel mac build setup
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          brew install nasm
          cargo install cargo-about --version 0.9.3 --locked --features cli
      # rustc leaves the library search path out of the extension, and delocate follows the rpath to find the libraries it bundles
      # install_name_tool needs spare Mach-O header space for the paths delocate writes
      - name: build ffmpeg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tools/ffmpeg-build.sh "$HOME/g2g-codecs" | sed 's/^export //' >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,$HOME/g2g-codecs/lib -C link-arg=-Wl,-headerpad_max_install_names" >> "$GITHUB_ENV"
          cp "$HOME"/g2g-codecs/ffmpeg-*/COPYING.LGPLv2.1 g2g-pyapi/LICENSE-FFMPEG.txt
      - name: build libvpx (macOS, Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          tools/libvpx-build.sh "$HOME/g2g-codecs" | sed 's/^export //' >> "$GITHUB_ENV"
          cp "$HOME/g2g-codecs/LICENSE-LIBVPX.txt" g2g-pyapi/
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: pin the MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$env:VCToolsInstallDir\bin\Hostx64\x64\link.exe" >> $env:GITHUB_ENV
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MSYS
          path-type: inherit
          update: false
          install: make nasm diffutils
      - name: build ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          tools/ffmpeg-build.sh /c/g2g-ffmpeg | sed 's/^export //' >> "$GITHUB_ENV"
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
          cp /c/g2g-ffmpeg/ffmpeg-*/COPYING.LGPLv2.1 g2g-pyapi/LICENSE-FFMPEG.txt
      # maturin puts every LICEN[CS]E* file next to pyproject.toml into the wheel
      - name: third-party licences
        shell: bash
        run: |
          cargo about generate --locked --fail -m g2g-pyapi/Cargo.toml --features ${{ matrix.features }} \
            about.hbs -o g2g-pyapi/LICENSE-THIRD-PARTY.txt
          cp LICENSE g2g-pyapi/
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: "1.16.0"
          working-directory: g2g-pyapi
          target: ${{ matrix.target }}
          manylinux: "2_28"
          before-script-linux: |
            dnf install -y clang-devel cmake nasm xz wayland-devel libxkbcommon-devel
            ../tools/ffmpeg-build.sh /opt/g2g-codecs
            ../tools/libvpx-build.sh /opt/g2g-codecs
            cp /opt/g2g-codecs/ffmpeg-*/COPYING.LGPLv2.1 LICENSE-FFMPEG.txt
            cp /opt/g2g-codecs/LICENSE-LIBVPX.txt .
          # repair copies the bundled ffmpeg libraries into the wheel
          docker-options: -e PKG_CONFIG_PATH=/opt/g2g-codecs/lib/pkgconfig -e VPX_STATIC=1 -e LD_LIBRARY_PATH=/opt/g2g-codecs/lib
          # --features replaces the list in pyproject.toml
          # maturin's macOS repair wrote an x86_64 extension that install_name_tool rejects as malformed
          args: --release --locked --out dist --auditwheel ${{ runner.os == 'macOS' && 'skip' || 'repair' }} --features ${{ matrix.features }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # auditwheel's Windows counterpart: copies the ffmpeg DLLs the extension imports into the wheel
      - name: bundle ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install delvewheel==1.13.2
          python -m delvewheel repair --add-path 'C:\g2g-ffmpeg\bin' -w g2g-pyapi/repaired g2g-pyapi/dist/*.whl
          rm g2g-pyapi/dist/*.whl
          mv g2g-pyapi/repaired/*.whl g2g-pyapi/dist/
      # auditwheel's macOS counterpart: copies the ffmpeg libraries the extension links into the wheel
      - name: bundle ffmpeg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m pip install delocate==0.13.0
          # delocate resolves the @rpath names inside the ffmpeg libraries on this variable
          DYLD_LIBRARY_PATH="$HOME/g2g-codecs/lib" delocate-wheel -w g2g-pyapi/repaired g2g-pyapi/dist/*.whl
          rm g2g-pyapi/dist/*.whl
          mv g2g-pyapi/repaired/*.whl g2g-pyapi/dist/
      - name: smoke run
        shell: bash
        run: |
          unzip -l g2g-pyapi/dist/*.whl | grep -q 'licenses/LICENSE-THIRD-PARTY.txt' || { echo "::error::wheel has no third-party licences"; exit 1; }
          python -m pip install g2g-pyapi/dist/*.whl
          python -c '
          import g2g
          sink = g2g.AppSink("out")
          pipeline = g2g.Pipeline("audiotestsrc num-buffers=2 ! appsink channel=out")
          frames = 0
          while sink.pull() is not None:
              frames += 1
          pipeline.wait()
          assert frames == 2, frames
          '
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: g2g-pyapi/dist/*.whl

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wheel
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux-package-install, msi-install, homebrew-install, aar]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-asset-*
          path: dist
          merge-multiple: true
      - name: attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --notes \
            "Changes are in CHANGELOG.md. These binaries leave out the elements that need distro libraries (PipeWire, Pulse): build those with \`cargo install g2g-plugins --features linux-full --bin g2g-launch\`."
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  homebrew-tap:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: github-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: release-asset-*-apple-darwin
          path: dist
          merge-multiple: true
      - name: update the formula in Glass2GlassHQ/homebrew-tap
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          key="$RUNNER_TEMP/tap-key"
          (umask 077; printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$key")
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:Glass2GlassHQ/homebrew-tap.git tap
          mkdir -p tap/Formula
          tools/homebrew-formula.sh "$version" "$GITHUB_REF_NAME" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" dist > tap/Formula/glass2glass.rb
          git -C tap add Formula/glass2glass.rb
          git -C tap -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "glass2glass $version"
          git -C tap push

