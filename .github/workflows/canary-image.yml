name: canary image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

# a newer green master commit replaces the build in flight, so :latest never goes backwards
concurrency:
  group: canary-image
  cancel-in-progress: true

jobs:
  image:
    # the branches filter also matches a pull request from a fork branch named master
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      G2G_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      # the release g2g-launch build with every canary feature runs out of disk on a stock runner
      - name: free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/.ghcup /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.G2G_COMMIT }}
          path: g2g
      - uses: actions/checkout@v7
        with:
          repository: Glass2GlassHQ/calliope
          ref: master
          path: calliope
      # the tag the canary's quadlet unit runs, so the two cannot drift
      - name: image name
        id: image
        run: |
          image=$(sed -n 's/^Image=//p' calliope/deploy/canary/g2g-canary.container)
          echo "latest=$image" >>"$GITHUB_OUTPUT"
          echo "commit=${image%:*}:${G2G_COMMIT::7}" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: calliope
          file: calliope/deploy/canary/Containerfile
          build-contexts: |
            g2g=g2g
          build-args: |
            G2G_COMMIT=${{ env.G2G_COMMIT }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.image.outputs.latest }}
            ${{ steps.image.outputs.commit }}
          push: true
