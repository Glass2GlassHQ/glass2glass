name: pages

# Publish the static site in docs/ to GitHub Pages via an explicit Actions
# workflow (build_type = "workflow"), replacing the deprecated legacy
# branch-based build whose auto-generated pages-build-deployment run hung in
# "deployment_queued" and timed out.
on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push cancels the older run: a run can get
# stuck in "waiting" on the github-pages environment, and with no cancellation
# it holds this group and blocks every later deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
  deploy:
    # deploy-pages in the job that uploaded the artifact sometimes lists no artifacts
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
