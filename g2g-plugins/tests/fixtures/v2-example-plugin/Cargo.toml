[package]
name = "g2g-v2-example-plugin"
description = "Out-of-tree example: a third-party g2g element written against the v2 plugin ABI."
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

# Stand-alone, like the v1 example: its own workspace root so `cargo build` here
# does not adopt the parent workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

# Passthrough features so the integration test can build this plugin against a
# DIFFERENT layout-affecting g2g-core feature set than the host. Under v1 that
# is exactly what makes the ABI tag differ and the load fail; under v2 nothing
# of g2g-core's crosses the boundary, so it must load and run anyway.
[features]
metadata = ["g2g-core/metadata"]
multi-thread = ["g2g-core/multi-thread"]
# Swap the macro-generated descriptor for a hand-written one whose `register`
# adds an element the declaration never mentioned, so the loader's capability
# gate has something to catch.
undeclared = []

# Path deps stand in for the published `g2g-core` (element traits) + `g2g-plugin`
# (the v2 ABI + `declare_plugin_v2!`) a `g2g-devel` package would provide.
[dependencies]
g2g-core = { path = "../../../../g2g-core", features = ["std", "runtime"] }
g2g-plugin = { path = "../../../../g2g-plugin" }
