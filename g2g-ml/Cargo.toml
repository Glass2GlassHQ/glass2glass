[package]
name = "g2g-ml"
description = "ML inference elements for glass2glass: burn (embedded/Wasm), ort (server) and executorch (on-device) backends."
license.workspace = true
readme = "README.md"
keywords = ["multimedia", "inference", "onnx", "executorch", "video"]
categories = ["multimedia::video", "multimedia", "science"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = ["g2g-core/std", "g2g-core/runtime"]
# Launch-line registration (`g2g_ml::register`): pad templates and a Registry,
# both of which live behind g2g-core's `runtime` feature. Off by default so the
# plain library build stays free of the runtime layer; an app that parses text
# pipelines enables it and calls `register` on the registry it built.
launch = ["std", "g2g-core/runtime"]
# Detection post-processing + the per-frame analytics metadata graph. Decodes a
# model output tensor into AnalyticsMeta detections (no inference engine needed);
# enables g2g-core's `metadata` feature so frames carry the typed graph.
analytics = ["g2g-core/metadata"]
# Run each frame's input conversion and session off the element's arm, on
# tokio's blocking pool, so the cooperative runner keeps the other elements
# moving during inference. Inline off-tokio.
offload = ["std", "g2g-core/offload"]
# Pure-Rust Burn backend with wgpu (design/README.md §5.2): BurnInference runs a
# deterministic linear-layer inference on the GPU through burn's wgpu backend,
# no C++ engine. Targets embedded / Wasm / RTOS / server alike.
burn = ["std", "dep:burn"]
# Inline GPU tensor preprocessing (design/README.md §5.1): WgpuPreprocess converts an
# NV12 frame to a normalized f32 NCHW RGB tensor in a wgpu compute shader.
# Pulls wgpu (any D3D12/Vulkan/Metal GPU) plus g2g-plugins for the shared
# GPU-frame owner types (WgpuNv12Texture); implies std.
wgpu =["std", "dep:wgpu", "dep:g2g-plugins", "g2g-plugins/wgpu-sink"]
# CUDA->wgpu zero-copy bridge element (CudaToWgpu, M220). Joins NVDEC CUDA NV12
# to WgpuPreprocess's surface-import path via g2g-plugins's Vulkan/CUDA
# external-memory interop, no PCIe round-trip. Implies wgpu; pulls
# g2g-plugins/cuda-wgpu (wgpu-hal + ash + libcuda FFI). Linux + NVIDIA only.
cuda-wgpu = ["wgpu", "dep:g2g-plugins", "g2g-plugins/cuda-wgpu"]
# DMABUF zero-copy capture/decode -> preprocess (M990): WgpuPreprocess imports a
# MemoryDomain::DmaBuf NV12 frame with Vulkan external memory and binds it
# straight into its compute pass, no CPU upload. The Linux analog of cuda-wgpu;
# pulls g2g-plugins/dmabuf-wgpu for the shared importer. Linux only. Implies wgpu.
dmabuf-wgpu = ["wgpu", "dep:g2g-plugins", "g2g-plugins/dmabuf-wgpu"]
# Android zero-copy decode -> preprocess (M304): WgpuPreprocess consumes the RGBA
# MemoryDomain::WgpuTexture that MediaCodecDec emits in GPU-output mode, sampling
# it straight into the tensor with no CPU round-trip. The Android analog of
# cuda-wgpu; pulls g2g-plugins/mediacodec-wgpu for the WgpuRgbaTexture keep-alive.
# Android only. Implies wgpu.
mediacodec-wgpu = ["wgpu", "dep:g2g-plugins", "g2g-plugins/mediacodec-wgpu"]
# libcamera capture -> GPU preprocess (M315): chain LibCameraSrc (Linux libcamera
# capture) through VideoConvert into WgpuPreprocess, a camera-to-NCHW-tensor path
# on the GPU. Pulls g2g-plugins/libcamera (needs libcamera-devel + libclang).
# Linux only. Implies wgpu.
libcamera-wgpu = ["wgpu", "dep:g2g-plugins", "g2g-plugins/libcamera"]
# Live webcam dma-buf capture -> GPU preprocess (M993): `v4l2src io-mode=dmabuf`
# exports the driver's capture buffers and WgpuPreprocess imports one straight
# into its YUYV compute pass. Adds V4l2Src to the dmabuf-wgpu path so the
# camera-side proof can run. Linux only.
v4l2-dmabuf-wgpu = ["dmabuf-wgpu", "g2g-plugins/v4l2"]
# ONNX Runtime bindings for server-class CUDA / TensorRT / CoreML paths.
# ort's default features download the platform's ONNX Runtime binaries at
# build time (network required on the first build).
ort = ["std", "dep:ort"]
# ExecuTorch 1.5.1 runtime via the `executorch` crate (ExecutorchInference runs a
# `.pte` program on the portable CPU kernels). The crate does not build the C++
# runtime: link it against the static libraries `tools/executorch-build.sh`
# builds, found through EXECUTORCH_RS_EXECUTORCH_LIB_DIR (build.rs adds the
# kernel libraries the crate leaves out).
executorch = ["std", "dep:executorch"]
# DirectML execution provider (Windows, any D3D12 GPU). Downloads a
# DirectML-enabled ONNX Runtime build; registration falls back to CPU at
# runtime when no device is available.
directml = ["ort", "ort/directml"]
# CUDA execution provider (NVIDIA GPU, Linux/Windows). Downloads a CUDA-enabled
# ONNX Runtime build; registration is best-effort and falls back to CPU at
# runtime when no CUDA device/runtime is present, like the directml EP. NOT
# verifiable without an NVIDIA device: the in-tree test confirms the EP wires,
# registers, and runs (on CUDA where present, else CPU), not that CUDA executed.
cuda = ["ort", "ort/cuda"]
# TensorRT execution provider (NVIDIA GPU through TensorRT's graph compiler).
# Rides on the CUDA-enabled ONNX Runtime download, so it builds wherever `cuda`
# does; enabling it at load needs the TensorRT runtime libraries (libnvinfer),
# else a named `execution-provider=tensorrt` fails loud.
tensorrt = ["cuda", "ort/tensorrt"]
# OpenVINO execution provider (Intel CPU / iGPU / NPU). The stock ONNX Runtime
# download builds but does not carry it, so a named provider fails loud until
# `ort` links an OpenVINO-enabled ONNX Runtime build (ORT_LIB_LOCATION).
openvino = ["ort", "ort/openvino"]
# ROCm execution provider (AMD GPU). `ort` ships no prebuilt ROCm binaries and
# falls back to the stock download with a build warning, so like `openvino` a
# named provider fails loud until `ort` links a ROCm ONNX Runtime build.
rocm = ["ort", "ort/rocm"]
# MIGraphX execution provider (AMD's graph compiler on ROCm). Like `openvino`:
# builds against the stock download, registers only on a MIGraphX-enabled
# ONNX Runtime build.
migraphx = ["ort", "ort/migraphx"]
# NNAPI execution provider (Android NPU / GPU / DSP via the system
# NeuralNetworks API). Android-target only: it links the Android ONNX Runtime
# build's NNAPI symbol, which a host ORT does not carry (unlike `cuda`, the
# `nnapi` feature does not select a different prebuilt), so enabling it on a
# non-Android target link-fails. Cross-compile with cargo-ndk
# (`--features nnapi`); never enable it in a host build / CI.
nnapi = ["ort", "ort/nnapi"]
# XNNPACK execution provider (ARM-optimized CPU): the Android CPU-side companion
# to `nnapi` (the accelerator-then-CPU pair, the MediaPipe delegate-with-fallback
# shape). Like `nnapi` it links a symbol a host ORT may lack, so treat it as an
# Android-target feature.
xnnpack = ["ort", "ort/xnnpack"]
# QNN execution provider (Qualcomm AI Engine Direct: Hexagon NPU / Adreno GPU on
# Snapdragon). Qualcomm's own NPU stack, the alternative to reaching the Hexagon
# via NNAPI. Like `nnapi` it links a symbol only the Qualcomm ORT build carries,
# so it is a Snapdragon-target feature, never enabled in a host build / CI.
qnn = ["ort", "ort/qnn"]
# CoreML execution provider (Apple Neural Engine / GPU on macOS / iOS). Like
# `nnapi` it links a symbol only the Apple ORT build carries, so it is an
# Apple-target feature, never enabled in a host (non-Apple) build / CI.
coreml = ["ort", "ort/coreml"]
# Live Android camera -> quantize -> Edge TPU inference chain (M443): pulls
# g2g-plugins (Camera2Src capture + TensorConvert quantize) alongside the NNAPI /
# XNNPACK EPs. Android-target only (it implies nnapi / xnnpack and g2g-plugins's
# android-only camera2). Drives the `android_camera_tpu_probe` on-device test.
camera2-tpu = ["nnapi", "xnnpack", "dep:g2g-plugins", "g2g-plugins/camera2"]
# Live Wayland window for the detect_overlay example (Linux desktop). Adds the
# wayland-sink display backend to the `examples/detect_overlay` graph; without it
# the example writes a still PPM. Pulls g2g-plugins's wayland-sink + analytics.
detect-overlay-live = ["ort", "analytics", "dep:g2g-plugins", "g2g-plugins/wayland-sink", "g2g-plugins/analytics"]
# CUDA<->wgpu GPU keep-on-GPU end-to-end tests (M220; moved here from the
# dissolved g2g-enterprise crate, M635). Forwards the decode side (g2g-plugins
# libcuda FFI + ffmpeg NVDEC) alongside the inference side so
# tests/cuda_wgpu_{scaffold,e2e}.rs can compose NvdecCuda -> CudaDownload ->
# WgpuPreprocess -> WgpuInference. Linux + NVIDIA + a wgpu adapter.
cuda-wgpu-e2e = ["cuda-wgpu", "g2g-plugins/cuda", "g2g-plugins/ffmpeg"]
# whisper.cpp speech-to-text via the `whisper-rs` crate: WhisperTranscribe turns
# 16 kHz mono f32 PCM into timed text frames from a ggml whisper model. The crate
# builds whisper.cpp from its vendored source (cmake + a C++ toolchain, libclang
# for the bindings), CPU kernels only here.
whisper = ["std", "dep:whisper-rs"]
# whisper.cpp with its CUDA kernels (nvcc and the CUDA toolkit at build time,
# found under /usr/local/cuda or /opt/cuda). Adds the `use-gpu` and
# `gpu-device` properties.
whisper-cuda = ["whisper", "whisper-rs/cuda"]
# whisper.cpp with its Vulkan kernels (the Vulkan loader, headers and `glslc` at
# build time). Same properties as `whisper-cuda`.
whisper-vulkan = ["whisper", "whisper-rs/vulkan"]
# llama.cpp text generation via the `llama-cpp-2` crate: LlamaChat answers each
# text frame as one chat turn on a GGUF model. Builds llama.cpp from the vendored
# source (cmake + C++ toolchain + libclang), CPU kernels with OpenMP.
llama = ["std", "dep:llama-cpp-2"]
# llama.cpp with its CUDA kernels (nvcc and the CUDA toolkit at build time).
# Build with CMAKE_CUDA_FLAGS=-Xcompiler=-fPIC: llama-cpp-sys-2 compiles the
# CUDA objects without it and the test and binary links fail. Adds the
# `n-gpu-layers` property.
llama-cuda = ["llama", "llama-cpp-2/cuda"]
# llama.cpp with its Vulkan kernels (the Vulkan loader, headers, `glslc` and the
# SPIRV-Headers CMake package at build time). Same property as `llama-cuda`.
llama-vulkan = ["llama", "llama-cpp-2/vulkan"]

[dependencies]
g2g-core = { workspace = true }
ort = { version = "2.0.0-rc.12", optional = true }
executorch = { version = "0.13.0", optional = true, features = ["module", "tensor-ptr"] }
# Inline GPU preprocessing (wgpu feature, §5.1). Default features pull the
# native backend per platform (dx12 on Windows).
wgpu = { version = "29", optional = true }
# Pure-Rust Burn deep-learning framework, wgpu backend (burn feature, §5.2).
burn = { version = "0.21", optional = true, default-features = false, features = ["std", "wgpu"] }
# CUDA<->wgpu interop primitives (cuda-wgpu feature, M220). Optional NORMAL dep
# (acyclic: g2g-plugins does not depend on g2g-ml) so the CudaToWgpu element can
# reach g2g_plugins::cudawgpu. The [dev-dependencies] entry below additionally
# pulls it (default features) for the end-to-end tests.
g2g-plugins = { workspace = true, optional = true }
# whisper.cpp bindings (whisper feature, GPU kernels through whisper-cuda /
# whisper-vulkan).
whisper-rs = { version = "0.16.0", optional = true }
# llama.cpp bindings (llama feature). Default features keep OpenMP and the
# `common` helpers the chat template path uses.
llama-cpp-2 = { version = "0.1.160", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
# The TensorBatcher integration test (tests/batcher.rs) drives the real
# run_muxer_sink runner.
g2g-core = { workspace = true, features = ["runtime", "std"] }
# Native end-to-end ML pipeline test (M61): the source/transform/sink elements
# (VideoTestSrc, VideoConvert, VideoScale, FakeSink) that the g2g-ml preprocess
# and inference elements compose with. g2g-plugins does not depend on g2g-ml,
# so this is dev-only and acyclic. `analytics` exposes AnalyticsOverlay for the
# detect_overlay example's still (PPM) path, `std` the `default_registry` the
# launch-line test parses against.
g2g-plugins = { workspace = true, features = ["analytics", "std"] }
# The MCU keyword check (m1705_mcu_keyword_ort) runs the heap-free g2g-mcu
# preprocessing and MicroFlow model on the host next to ONNX Runtime. The
# MicroFlow `#[model]` expansion names `microflow::` and `nalgebra::` paths.
g2g-mcu = { workspace = true, features = ["microflow"] }
microflow = "0.1.3"
nalgebra = { version = "0.32", default-features = false }
# The live-camera dma-buf test (M993) reads a capture buffer back through mmap(2),
# the only way to look at a dma-buf from the CPU.
libc = "0.2"

[lints]
workspace = true

# Visual detector demo: real YOLO detections drawn back onto the frame (still PPM,
# or a live Wayland window under `detect-overlay-live`). Needs ort + analytics; it
# loads the gitignored YOLO fixture and skips when absent, so it is excluded from
# the default build (like the gated GPU / Android tests).
[[example]]
name = "detect_overlay"
required-features = ["ort", "analytics"]

# `ort` downloads the ONNX Runtime binaries at build time, so it can never build
# in the docs.rs sandbox; `burn` and the execution-provider features need a GPU /
# NPU toolchain. This is the crates.io-only subset.
[package.metadata.docs.rs]
features = ["std", "launch", "analytics", "wgpu"]
