[package]
name = "g2g-wayland-display"
description = "Headless Wayland compositor source for glass2glass."
license.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
# smithay has no crates.io release with the API this crate is written against
publish = false

[features]
ffmpeg = ["display", "g2g-plugins/ffmpeg"]
cuda = ["ffmpeg", "g2g-plugins/dmabuf-cuda", "g2g-plugins/nvenc"]
display = [
    "dep:g2g-core",
    "dep:g2g-plugins",
    "dep:smithay",
    "dep:tokio",
    "dep:xcursor",
]

[target.'cfg(target_os = "linux")'.dependencies]
g2g-core = { workspace = true, features = ["std", "runtime"], optional = true }
g2g-plugins = { workspace = true, features = ["std"], optional = true }
tokio = { version = "1", features = ["sync"], optional = true }
xcursor = { version = "0.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies.smithay]
# smithay's X11Wm::new_selection does not flush, so X11 clipboard copies lose to the remote text set before them
git = "https://github.com/boxerab/smithay"
rev = "6f0cd2ea16c7c38f052a594d22d130155fd2d78b"
optional = true
default-features = false
features = [
    "backend_egl",
    "backend_gbm",
    "desktop",
    "renderer_gl",
    "renderer_pixman",
    "wayland_frontend",
    "xwayland",
]

[target.'cfg(target_os = "linux")'.dev-dependencies]
g2g-plugins = { workspace = true, features = ["std", "wgpu-present"] }
smithay-client-toolkit = { version = "0.21", default-features = false }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
x11rb = "0.14"

[lints]
workspace = true
