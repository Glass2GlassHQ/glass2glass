[package]
name = "g2g-plugin"
description = "SDK for building dynamically loadable glass2glass plugins (the declare_plugin! macro + ABI tag)."
license.workspace = true
readme = "README.md"
keywords = ["multimedia", "plugin", "sdk", "pipeline", "video"]
categories = ["multimedia", "development-tools"]
version.workspace = true
edition.workspace = true
# Conservative MSRV with g2g-core: a third party builds their plugin against this.
rust-version = "1.86"
authors.workspace = true
repository.workspace = true

# The plugin SDK exists to register elements into a `Registry`, which is the
# std-only auto-plug layer; so the SDK pulls g2g-core with `std` + `runtime`.
# A plugin author depends on this crate (for `declare_plugin!`) and on g2g-core
# (for the element traits) against the same published versions the host uses.
[dependencies]
g2g-core = { workspace = true, features = ["std", "runtime"] }
# FFI-safe `Future`: the v2 plugin ABI's poll boundary (`FfiFuture` / `FfiContext`
# / `FfiPoll`). Pure Rust, no dependencies of its own, MSRV 1.56, so it fits this
# crate's 1.86 floor.
async-ffi = "0.5"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
