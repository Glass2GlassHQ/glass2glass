[package]
name = "g2g-desktop"
description = "Remote-desktop host and client on glass2glass."
license.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "g2g-desktop"
path = "src/main.rs"
required-features = ["session"]

[features]
session = [
    "dep:g2g-core",
    "g2g-plugins/webtransport",
    "g2g-plugins/d3d11-screen-capture",
    "g2g-plugins/d3d11-convert",
    "g2g-plugins/mf-encode",
    "g2g-plugins/d3d12-decode",
    "dep:windows",
    "g2g-plugins/wgpu-present",
    "g2g-plugins/metadata",
    "tokio/time",
    "tokio/macros",
    "tokio/signal",
    "tokio/rt-multi-thread",
]

[dependencies]
g2g-core = { workspace = true, features = ["std"], optional = true }
g2g-plugins = { workspace = true }
keycode = "1.0"
subtle = "2.6"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
# cargo merges this optional entry only on linux, once a g2g-plugins feature in session turns it on
g2g-plugins = { workspace = true, optional = true, features = ["ffmpeg", "portal"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
