[package]
name = "g2g-desktop"
description = "Remote-desktop host and client on glass2glass."
license.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "g2g-desktop"
path = "src/main.rs"
required-features = ["session"]

[features]
session = [
    "dep:g2g-core",
    "g2g-plugins/webrtc",
    "g2g-plugins/ffmpeg",
    "g2g-plugins/portal",
    "g2g-plugins/wgpu-present",
    "tokio/net",
    "tokio/io-util",
    "tokio/time",
    "tokio/macros",
    "tokio/rt-multi-thread",
]

[dependencies]
g2g-core = { workspace = true, features = ["std"], optional = true }
g2g-plugins = { workspace = true }
keycode = "1.0"
subtle = "2.6"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[lints]
workspace = true
