[package]
name = "g2g-desktop"
description = "Remote-desktop host and client on glass2glass."
license.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "g2g-desktop"
path = "src/main.rs"
required-features = ["session"]

[features]
session = [
    "dep:g2g-core",
    "dep:g2g-wayland-display",
    "dep:x11rb",
    "g2g-plugins/webtransport",
    "g2g-plugins/d3d11-screen-capture",
    "g2g-plugins/d3d11-convert",
    "g2g-plugins/mf-encode",
    "g2g-plugins/d3d12-decode",
    "dep:windows",
    "g2g-plugins/wgpu-present",
    "g2g-plugins/metadata",
    "tokio/time",
    "tokio/macros",
    "tokio/signal",
    "tokio/process",
    "tokio/rt-multi-thread",
]
gamestream = [
    "session",
    "tokio/net",
    "tokio/io-util",
    "dep:aes",
    "dep:dirs",
    "dep:form_urlencoded",
    "dep:gethostname",
    "dep:hex",
    "dep:httparse",
    "dep:mdns-sd",
    "dep:rand",
    "dep:rcgen",
    "dep:ring",
    "dep:rsa",
    "dep:rustls",
    "dep:sha2",
    "dep:tokio-rustls",
    "dep:x509-parser",
]

[dependencies]
g2g-core = { workspace = true, features = ["std"], optional = true }
g2g-plugins = { workspace = true }
keycode = "1.0"
subtle = "2.6"
tokio = { version = "1", features = ["sync"] }
aes = { version = "0.8", optional = true }
dirs = { version = "6", optional = true }
form_urlencoded = { version = "1", optional = true }
gethostname = { version = "1.1", optional = true }
hex = { version = "0.4", optional = true }
httparse = { version = "1.10", optional = true }
mdns-sd = { version = "0.22", optional = true }
rand = { version = "0.10", optional = true }
rcgen = { version = "0.14", optional = true }
ring = { version = "0.17", optional = true }
rsa = { version = "0.10", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "logging", "std", "tls12"] }
sha2 = { version = "0.10", optional = true }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "logging", "tls12"] }
x509-parser = { version = "0.18", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
# cargo merges this optional entry only on linux, once a g2g-plugins feature in session turns it on
g2g-plugins = { workspace = true, optional = true, features = ["ffmpeg", "portal", "dmabuf-cuda", "nvenc", "x11", "pulse-src", "pulse-sink", "opus"] }
g2g-wayland-display = { path = "../g2g-wayland-display", optional = true, features = ["display"] }
x11rb = { version = "0.14", optional = true, features = ["xtest"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = "0.14"

[lints]
workspace = true
