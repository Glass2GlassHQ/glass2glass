# ESP32-S3 on-device harness for the XIAO ESP32S3 Sense. Not a workspace member
# (see root `exclude`): it needs Espressif's xtensa toolchain from espup.
[package]
name = "g2g-esp32s3"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[workspace]

[dependencies]
noalloc-pipeline = { path = "../noalloc-pipeline" }
g2g-core = { path = "../../g2g-core", default-features = false }
g2g-mcu = { path = "../../g2g-mcu" }
# i2s is behind esp-hal's `unstable` feature.
esp-hal = { version = "1.2.2", features = ["esp32s3", "unstable"] }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32s3", "jtag-serial"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
static_cell = "2"
esp-radio = { version = "1.0.0-beta.1", features = ["esp32s3", "wifi", "esp-alloc"] }
esp-rtos = { version = "0.4.0", features = ["esp32s3", "esp-radio", "esp-alloc", "embassy"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
embassy-net = { version = "0.9.1", features = ["udp", "dhcpv4", "medium-ethernet", "proto-ipv4"] }
# embassy-time-queue-utils' default queue panics on wakers not made by embassy-executor
embassy-time-queue-utils = { version = "0.3.2", features = ["generic-queue-16"] }
embassy-futures = "0.1.2"

[build-dependencies]
cc = "1.11.2"

[profile.release]
opt-level = "s"
# esp 1.94 to 1.98.0 fail with "Cannot select PCREL_WRAPPER" under LTO, esp-rs/rust issue 283
lto = false
codegen-units = 1
panic = "abort"
debug = true

# esp-radio: the radio blobs need opt-level 2 or 3 to connect
[profile.release.package.esp-radio]
opt-level = 3
