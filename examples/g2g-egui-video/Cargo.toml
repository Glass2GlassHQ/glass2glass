[package]
name = "g2g-egui-video"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[workspace]

[dependencies]
eframe = "0.37"
g2g-core = { path = "../../g2g-core", features = ["std", "runtime"] }
g2g-plugins = { path = "../../g2g-plugins", features = ["std", "ffmpeg", "vello-overlay"] }
# clocksync paces frames with tokio timers
tokio = { version = "1", features = ["rt", "time"] }
