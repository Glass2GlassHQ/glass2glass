[package]
name = "g2g-gtk4-video"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[workspace]

[dependencies]
gtk4 = { version = "0.11", features = ["v4_14"] }
g2g-core = { path = "../../g2g-core", features = ["std", "runtime"] }
g2g-plugins = { path = "../../g2g-plugins", features = ["std", "v4l2"] }
# clocksync paces frames with tokio timers
tokio = { version = "1", features = ["rt", "time"] }
